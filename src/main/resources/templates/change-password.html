<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: header}"></head>
<body class="bg-gray-50 min-h-screen flex flex-col">

<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="flex-1 flex items-center justify-center px-4">
    <div class="w-full max-w-md">
        <div class="bg-white rounded-2xl shadow-lg p-8">

            <!-- Title -->
            <div class="text-center mb-6">
                <span class="text-4xl">🔒</span>
                <h2 class="text-2xl font-bold text-gray-800 mt-2">Ganti Password</h2>
                <p class="text-gray-500 text-sm mt-1">Masukkan password lama dan password baru</p>
            </div>

            <!-- Error -->
            <div th:if="${error}"
                 class="bg-red-50 border border-red-200 text-red-700 rounded-lg px-4 py-3 mb-4 text-sm"
                 th:text="${error}">
            </div>

            <!-- Success -->
            <div th:if="${success}"
                 class="bg-green-50 border border-green-200 text-green-700 rounded-lg px-4 py-3 mb-4 text-sm"
                 th:text="${success}">
            </div>

            <!-- Form -->
            <form th:action="@{/change-password}" th:object="${changePasswordRequest}" method="post" class="space-y-4">

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Password Lama</label>
                    <input type="password" th:field="*{oldPassword}"
                           class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"
                           placeholder="Masukkan password lama" required>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Password Baru</label>
                    <input type="password" th:field="*{newPassword}"
                           class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"
                           placeholder="Masukkan password baru" required>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Konfirmasi Password Baru</label>
                    <input type="password" th:field="*{confirmPassword}"
                           class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"
                           placeholder="Ulangi password baru" required>
                </div>

                <button type="submit"
                        class="w-full bg-indigo-600 text-white py-2 rounded-lg font-medium hover:bg-indigo-700 transition text-sm">
                    Ganti Password
                </button>
            </form>

            <div class="text-center mt-4">
                <a th:href="@{/profile}" class="text-indigo-600 text-sm hover:underline">
                    ← Kembali ke Profil
                </a>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
